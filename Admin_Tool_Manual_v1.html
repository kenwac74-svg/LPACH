            return `
                <div class="card" style="border-left: 4px solid var(--danger); margin-bottom: 20px;">
                    <div class="card-header"><h3><i data-lucide="store"></i> CNYT P2P MARKET 및 내부 이체 마스터 스위치</h3></div>
                    <div style="display:flex; gap:20px; margin-top:15px;">
                        <div class="form-group" style="flex:1; display:flex; align-items:center; justify-content:space-between; background:#111; padding:15px; border-radius:6px;">
                            <div><label style="margin:0; font-weight:bold; color:#fff;">P2P 마켓플레이스 전체 활성화</label></div><label class="toggle-switch"><input type="checkbox" id="p2p-master-switch" ${p2p.status === 'Active' ? 'checked' : ''}><span class="slider"></span></label>
                        </div>
                        <div class="form-group" style="flex:1; display:flex; align-items:center; justify-content:space-between; background:#111; padding:15px; border-radius:6px; border:1px solid rgba(212,175,55,0.3);">
                            <div><label style="margin:0; font-weight:bold; color:var(--gold-primary);">ID 기반 P2P 내부 이체 허용</label></div><label class="toggle-switch"><input type="checkbox" id="p2p-internal-switch" ${p2p.internalTransferEnabled ? 'checked' : ''}><span class="slider"></span></label>
                        </div>
                    </div>
                </div>
                <div class="user-detail-grid">
                    <div style="display:flex; flex-direction:column; gap:20px;">
                        <div class="detail-section">
                            <h4><i data-lucide="bar-chart-2"></i> P2P 마켓 상단 지표 오버라이드</h4>
                            <div style="display:flex; gap:15px;"><div class="form-group" style="flex:1;"><label>CNYT 인덱스 기준가</label><input type="text" class="form-control" id="p2p-price" value="${p2p.indexPrice}" style="font-weight:bold; color:var(--gold-primary);"></div><div class="form-group" style="flex:1;"><label>가격 등락률 (%)</label><input type="text" class="form-control" id="p2p-price-trend" value="${p2p.priceTrend}" style="color:var(--success);"></div></div>
                            <div style="display:flex; gap:15px;"><div class="form-group" style="flex:1;"><label>24H 거래량</label><input type="text" class="form-control" id="p2p-vol" value="${p2p.volume24h}"></div><div class="form-group" style="flex:1;"><label>활성 매물</label><input type="text" class="form-control" id="p2p-list" value="${p2p.activeListings}"></div></div>
                        </div>
                        <div class="detail-section" style="border: 1px solid rgba(239,68,68,0.3);">
                            <h4 style="color:var(--danger);"><i data-lucide="shield-check"></i> 1:1 내부 이체(Transfer) 보안 통제</h4>
                            <div class="form-group" style="display:flex; align-items:center; justify-content:space-between; background:#111; padding:10px; border-radius:4px; margin-bottom:5px;"><span>이메일 OTP 인증 필수 설정</span><label class="toggle-switch"><input type="checkbox" id="p2p-req-otp" ${p2p.requireOTP ? 'checked' : ''}><span class="slider"></span></label></div>
                            <div class="form-group" style="display:flex; align-items:center; justify-content:space-between; background:#111; padding:10px; border-radius:4px; margin-bottom:15px;"><span>Trading PIN 필수 설정</span><label class="toggle-switch"><input type="checkbox" id="p2p-req-pin" ${p2p.requirePIN ? 'checked' : ''}><span class="slider"></span></label></div>
                            <div style="display:flex; gap:15px;"><div class="form-group" style="flex:1;"><label>최소 전송량 (CNYT)</label><input type="number" class="form-control" id="p2p-min-tx" value="${p2p.minTransfer}"></div><div class="form-group" style="flex:1;"><label>최대 전송량 (CNYT)</label><input type="number" class="form-control" id="p2p-max-tx" value="${p2p.maxTransfer}"></div></div>
                        </div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:20px;">
                        <div class="detail-section" style="border: 1px solid rgba(59,130,246,0.3);">
                            <h4 style="color:var(--info);"><i data-lucide="bot"></i> 마켓 메이커(MM) 봇 가동 제어</h4>
                            <div class="form-group" style="display:flex; align-items:center; justify-content:space-between; background:#111; padding:15px; border-radius:6px;"><label style="margin:0; font-weight:bold;">가짜 주문 생성</label><label class="toggle-switch"><input type="checkbox" id="p2p-bot-switch" ${p2p.mmBotEnabled ? 'checked' : ''}><span class="slider" style="background-color: #333;"></span></label></div>
                        </div>
                        <div class="detail-section" style="border: 1px solid rgba(212,175,55,0.3);">
                            <h4 style="color:var(--gold-primary);"><i data-lucide="percent"></i> P2P 거래 수수료 정책</h4>
                            <div class="form-group"><div style="display:flex; align-items:center; gap:10px;"><input type="text" class="form-control" id="p2p-fee" value="${p2p.transactionFee}" style="width: 120px; text-align:right; font-weight:bold;"><span style="font-size:1.1rem; color:var(--text-main);">%</span></div></div>
                        </div>
                        <div class="detail-section">
                            <h4><i data-lucide="shield-check"></i> Market Safety 안내 문구</h4>
                            <div class="form-group"><label>항목 1</label><input type="text" class="form-control" id="p2p-safe1" value="${p2p.safetyText1}"></div><div class="form-group"><label>항목 2</label><input type="text" class="form-control" id="p2p-safe2" value="${p2p.safetyText2}"></div><div class="form-group"><label>항목 3</label><input type="text" class="form-control" id="p2p-safe3" value="${p2p.safetyText3}"></div>
                        </div>
                    </div>
                </div>
                <div class="card" style="margin-top: 20px;">
                    <div class="card-header"><h3><i data-lucide="list-video"></i> 실시간 1:1 내부 이체 모니터링 (Internal Ledger)</h3><div style="display:flex; gap:10px;"><input type="text" class="form-control" placeholder="User ID 검색..." style="width:200px;"><button class="btn-primary btn-sm">조회</button></div></div>
                    <table style="margin-top:15px;"><thead><tr><th>TX ID</th><th>Sender</th><th></th><th>Receiver</th><th>수량</th><th>상태</th><th>발생 일시</th><th>관리</th></tr></thead><tbody>${logTrs}</tbody></table>
                </div>
                <div style="margin-top: 20px; text-align: right; padding-top:20px; border-top:1px solid #333;"><button class="btn-primary" onclick="saveP2PMarket()" style="padding:12px 25px;"><i data-lucide="save" style="width:18px; height:18px; display:inline-block; vertical-align:middle; margin-right:5px;"></i> P2P 마켓 정책 배포</button></div>
            `;
        }

        window.cancelInternalTransfer = function(txId) { const log = db.p2pLogs.find(l => l.txId === txId); if(log && log.status === 'PENDING') { if(confirm('강제 취소하시겠습니까?')) { log.status = 'CANCELLED (ROLLBACK)'; alert('취소/롤백됨'); render(); } } };

        function viewWithdrawals() {
            let trs = db.withdrawals.map(w => `<tr><td>${w.reqId}</td><td><strong>${w.user}</strong></td><td style="color:var(--danger); font-weight:bold;">$${w.amount.toLocaleString()}</td><td>${w.asset}</td><td>${w.date}</td><td><button class="btn-primary btn-sm" style="background:var(--success); border:none;" onclick="alert('승인됨')">승인</button> <button class="btn-danger btn-sm" onclick="alert('반려됨')">반려</button></td></tr>`).join('');
            return `
                <div class="card">
                    <div class="card-header"><h3><i data-lucide="arrow-down-to-line"></i> 출금 요청 대기열</h3></div>
                    <table style="margin-top:15px;"><thead><tr><th>요청 ID</th><th>회원 ID</th><th>요청 금액</th><th>자산</th><th>요청 일시</th><th>승인/반려</th></tr></thead><tbody>${trs || '<tr><td colspan="6" style="text-align:center;">요청 없음</td></tr>'}</tbody></table>
                </div>
            `;
        }

        function viewBoard() {
            let trs = db.tickets.map(t => {
                let catClass = t.category === 'FINANCE' ? 'warning' : (t.category === 'TECHNICAL' ? 'info' : 'success');
                let statusClass = t.status === 'RESOLVED' ? 'success' : 'danger';
                return `<tr><td style="color:var(--text-muted); font-family:monospace;">${t.id}</td><td><span class="badge ${catClass}" style="font-size:0.65rem;">${t.category}</span></td><td style="font-weight:bold; color:#fff;">${t.title}</td><td style="color:var(--gold-primary); cursor:pointer;" onclick="openUserModal('${t.author}')">${t.author}</td><td style="font-size:0.8rem; color:var(--text-muted);">${t.date}</td><td><span class="badge ${statusClass}">${t.status}</span></td><td><button class="btn-primary btn-sm" onclick="alert('티켓 상세 및 답변 팝업 열기')" style="font-size:0.75rem;">${t.status === 'PENDING' ? '<i data-lucide="message-square" style="width:12px;height:12px;"></i> 답변하기' : '상세보기'}</button></td></tr>`;
            }).join('');
            return `
                <div class="card" style="border-left: 4px solid var(--success); margin-bottom: 20px;">
                    <div class="card-header">
                        <h3><i data-lucide="ticket"></i> CS 데스크: 1:1 문의 (Tickets) 현황</h3>
                        <div style="display:flex; gap:10px;"><select class="form-control" style="width:150px;"><option>All Status</option><option>Pending</option><option>Resolved</option></select><input type="text" class="form-control" placeholder="Ticket ID / User ID 검색..." style="width:250px;"><button class="btn-primary">검색</button></div>
                    </div>
                    <p style="color:var(--text-muted); font-size:0.85rem;">유저가 프론트엔드(My Inquiries)를 통해 접수한 모든 문의 내역입니다.</p>
                </div>
                <table style="margin-top:15px; background:var(--bg-card); border-radius:8px;">
                    <thead><tr><th style="width:100px;">Ticket ID</th><th style="width:100px;">Category</th><th>Subject (문의 제목)</th><th style="width:120px;">User ID</th><th style="width:150px;">Date</th><th style="width:100px;">Status</th><th style="width:120px;">Action</th></tr></thead>
                    <tbody>${trs || '<tr><td colspan="7" style="text-align:center; padding:20px;">등록된 문의가 없습니다.</td></tr>'}</tbody>
                </table>
            `;
        }

        function viewSettings() {
            return `
                <div class="danger-zone">
                    <h3>🚨 M13 EXIT STRATEGY</h3>
                    <p>V6 기획안: 첫 만기 도래 전 플랫폼 종료 프로토콜입니다.<br>가동 시 즉시 프론트엔드의 <b>모든 가입/입금/출금이 차단</b>됩니다.</p>
                    <div style="display:flex; gap:15px; align-items:center;"><input type="text" class="form-control" placeholder="'CONFIRM EXIT' 입력" style="width:200px; border-color:var(--danger);"><button class="btn-danger" onclick="alert('⚠️ M13 EXIT 프로토콜이 가동되었습니다.')">프로토콜 즉시 가동</button></div>
                </div>
            `;
        }

        // --- Payouts (DLQ & Recovery) ---
        window.executePrecisionRecovery = function() { const userId = document.getElementById('rec-user').value.trim(); const type = document.getElementById('rec-type').value; const ref = document.getElementById('rec-ref').value.trim(); const amount = parseFloat(document.getElementById('rec-amount').value); const asset = document.getElementById('rec-asset').value; if(!userId || isNaN(amount) || amount <= 0) { alert("❌ 오류"); return; } const user = db.users.find(u => u.id === userId); if(!user) { alert("❌ 없는 유저"); return; } if(confirm(`지급 확인?`)) { if(asset === 'USDT') user.usdt += amount; else user.cnyt += amount; db.payoutLogs.unshift({ id: 'TX-MAN-' + Math.floor(Math.random() * 9000 + 1000), user: user.id, type: type, amount: `${amount.toFixed(2)} ${asset}`, status: 'SUCCESS (MANUAL)', reason: `복구기준: ${ref || '-'}`, date: new Date().toISOString().replace('T',' ').substring(0, 19) }); alert(`✅ 복구 성공`); render(); } };
        window.recoverSinglePayout = function(txId) { const log = db.payoutLogs.find(l => l.id === txId); if(!log || log.status !== 'FAILED') return; const user = db.users.find(u => u.id === log.user); if(!user) return; if(confirm(`수동 지급?`)) { const parts = log.amount.split(' '); const amt = parseFloat(parts[0]); const asset = parts[1]; if(asset === 'USDT') user.usdt += amt; else if(asset === 'CNYT') user.cnyt += amt; log.status = 'SUCCESS (MANUAL RECOVERED)'; log.reason = 'Admin Manual Recovery'; if(db.payoutSystem.failedCount > 0) db.payoutSystem.failedCount--; if(db.payoutSystem.failedCount === 0) db.payoutSystem.status = 'OK'; alert(`✅ 완료`); render(); } };
        window.retryFailedPayouts = function() { if(db.payoutSystem.failedCount === 0) return; if(confirm(`재처리하시겠습니까?`)) { db.payoutSystem.failedCount = 0; db.payoutSystem.status = 'OK'; db.payoutLogs.forEach(log => { if(log.status === 'FAILED') { log.status = 'SUCCESS (RECOVERED)'; log.reason = 'Auto DLQ Retry'; } }); alert("✅ 완료"); render(); } };
        window.triggerRollback = function() { const code = prompt("롤백하시겠습니까? 'ROLLBACK' 입력"); if(code === 'ROLLBACK') { alert("롤백됨"); db.payoutSystem.status = 'OK'; db.payoutSystem.failedCount = 0; render(); } };
        window.toggleEngine = function(engineKey) { db.payoutSystem.engines[engineKey] = !db.payoutSystem.engines[engineKey]; render(); };
        window.filterFailedUsers = function(query) {
            const dropdown = document.getElementById('failed-user-dropdown');
            if(!query) { dropdown.style.display = 'none'; return; }
            const failedUserIds = [...new Set(db.payoutLogs.filter(l => l.status === 'FAILED').map(l => l.user))];
            const matchedUsers = db.users.filter(u => failedUserIds.includes(u.id) && (u.id.toLowerCase().includes(query.toLowerCase()) || u.nickname.toLowerCase().includes(query.toLowerCase())));
            if(matchedUsers.length > 0) { dropdown.innerHTML = matchedUsers.map(u => `<div style="padding:10px; border-bottom:1px solid #333; cursor:pointer;" onclick="selectFailedUser('${u.id}')" onmouseover="this.style.background='rgba(212,175,55,0.1)'" onmouseout="this.style.background='transparent'"><strong style="color:var(--gold-primary);">${u.id}</strong> - ${u.nickname}</div>`).join(''); } else { dropdown.innerHTML = `<div style="padding:10px; color:var(--text-muted); text-align:center;">없음</div>`; }
            dropdown.style.display = 'block';
        };
        window.selectFailedUser = function(id) {
            document.getElementById('rec-user').value = id; document.getElementById('failed-user-dropdown').style.display = 'none';
            const log = db.payoutLogs.find(l => l.user === id && l.status === 'FAILED');
            if(log) {
                const selectType = document.getElementById('rec-type');
                if(selectType) { for(let i=0; i<selectType.options.length; i++) { if(selectType.options[i].value === log.type || selectType.options[i].text.includes(log.type)) { selectType.selectedIndex = i; break; } } }
                const amtInput = document.getElementById('rec-amount');
                if(amtInput) { const amt = parseFloat(log.amount); if(!isNaN(amt)) amtInput.value = amt; }
                const assetSelect = document.getElementById('rec-asset');
                if(assetSelect) { if(log.amount.includes('CNYT')) assetSelect.value = 'CNYT'; else assetSelect.value = 'USDT'; }
            }
        };

        function viewPayouts() {
            const sys = db.payoutSystem;
            const isError = sys.failedCount > 0;
            let logTrs = db.payoutLogs.map(l => { let sClass = l.status.includes('SUCCESS') ? 'success' : 'danger'; let actionBtn = l.status === 'FAILED' ? `<button class="btn-primary btn-sm" onclick="recoverSinglePayout('${l.id}')" style="background:var(--info); border:none; padding: 4px 8px; font-size: 0.7rem;">수동지급</button>` : `<span style="color:var(--text-muted); font-size:0.8rem;">-</span>`; return `<tr><td style="color:var(--text-muted); font-family:monospace;">${l.id}</td><td><strong>${l.user}</strong></td><td><span class="badge" style="background:#222;">${l.type}</span></td><td style="color:var(--gold-primary); font-weight:bold;">${l.amount}</td><td><span class="badge ${sClass}">${l.status}</span></td><td style="color:var(--text-muted); font-size:0.8rem;">${l.reason}</td><td style="color:var(--text-muted); font-size:0.8rem;">${l.date}</td><td>${actionBtn}</td></tr>`; }).join('');

            return `
                <div class="user-detail-grid">
                    <div class="detail-section">
                        <h4><i data-lucide="cpu"></i> 5대 수당 엔진 크론 스케줄러</h4><p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:15px;">매일 00:00 UTC에 실행되는 5가지 수당 엔진을 개별 통제합니다.</p>
                        <div style="display:flex; flex-direction:column; gap:10px;"><div style="display:flex; justify-content:space-between; align-items:center; background:#111; padding:12px; border-radius:6px;"><span>1. AI 데일리 노드 수당 (ROI)</span><label class="toggle-switch"><input type="checkbox" ${sys.engines.dailyROI?'checked':''} onchange="toggleEngine('dailyROI')"><span class="slider"></span></label></div><div style="display:flex; justify-content:space-between; align-items:center; background:#111; padding:12px; border-radius:6px;"><span>2. 직추천 10% 커미션 수당</span><label class="toggle-switch"><input type="checkbox" ${sys.engines.directBonus?'checked':''} onchange="toggleEngine('directBonus')"><span class="slider"></span></label></div><div style="display:flex; justify-content:space-between; align-items:center; background:#111; padding:12px; border-radius:6px;"><span>3. 드래곤 롤업 수당</span><label class="toggle-switch"><input type="checkbox" ${sys.engines.rollupBonus?'checked':''} onchange="toggleEngine('rollupBonus')"><span class="slider"></span></label></div><div style="display:flex; justify-content:space-between; align-items:center; background:#111; padding:12px; border-radius:6px;"><span>4. 직급 배당 보너스</span><label class="toggle-switch"><input type="checkbox" ${sys.engines.rankShare?'checked':''} onchange="toggleEngine('rankShare')"><span class="slider"></span></label></div><div style="display:flex; justify-content:space-between; align-items:center; background:#111; padding:12px; border-radius:6px; border:1px solid rgba(196,181,253,0.3);"><span style="color:var(--cnyt-color);">5. 패키지 구매 시 CNYT 페이백</span><label class="toggle-switch"><input type="checkbox" ${sys.engines.cnytAirdrop?'checked':''} onchange="toggleEngine('cnytAirdrop')"><span class="slider"></span></label></div></div>
                    </div>
                    <div class="detail-section" style="border: 1px solid ${isError ? 'var(--danger)' : 'var(--success)'};">
                        <h4 style="color:${isError ? 'var(--danger)' : 'var(--success)'};"><i data-lucide="${isError ? 'alert-triangle' : 'check-circle'}"></i> 에러 감지 및 복구 (DLQ Monitor)</h4>

                        ${isError ? `<div style="background:rgba(239,68,68,0.1); padding:15px; border-radius:6px; margin-bottom:15px;"><strong style="color:var(--danger); display:block; margin-bottom:5px;">⚠️ 수당 지급 실패 감지</strong><p style="font-size:0.8rem; color:var(--text-muted); margin:0; line-height:1.4;">네트워크 타임아웃이나 DB 락(Lock)으로 인해 다수 유저에게 수당이 지급되지 않았습니다. 하단 버튼을 눌러 실패한 항목만 안전하게 일괄 재처리 하십시오.</p></div><button class="btn-danger" style="width:100%; margin-bottom:10px; padding:12px; display:flex; justify-content:center; align-items:center; gap:8px;" onclick="retryFailedPayouts()"><i data-lucide="refresh-ccw"></i> 누락 수당 일괄 재처리</button>` : `<div style="background:rgba(34,197,94,0.1); padding:15px; border-radius:6px; margin-bottom:15px; text-align:center;"><p style="color:var(--success); font-weight:bold; margin:0;">모든 수당이 지급되었습니다.</p></div>`}

        window.closeUserModal = function() { appState.currentUserDetailId = null; render(); };
        window.openUserModal = function(id) { appState.currentUserDetailId = id; render(); };
        window.killUserSession = function(id, index) { const user = db.users.find(u => u.id === id); if(user && user.loginHistory) { if(confirm('세션을 강제 종료하시겠습니까?')) { user.loginHistory.splice(index, 1); render(); } } };
        window.freezeUserAccount = function(id) { const user = db.users.find(u => u.id === id); if(user) { const check = prompt(`[긴급] ${user.nickname} 님의 계정을 즉시 동결(정지)합니다. 사유를 입력하세요.`); if(check) { user.status = 'Inactive'; user.permissions.deposit = false; user.permissions.withdraw = false; user.permissions.swap = false; alert('계정이 동결되었습니다.'); render(); } } };
        window.resetUserSecurity = function(id, type) { const user = db.users.find(u => u.id === id); if(!user) return; if(type === 'password') { if(confirm('비밀번호를 초기화하시겠습니까?')) { alert('초기화되었습니다.'); } } else if(type === 'pin') { if(confirm('PIN을 초기화하시겠습니까?')) { user.tradingPinSet = false; alert('초기화되었습니다.'); } } else if(type === 'phishing') { if(confirm('피싱 코드를 삭제하시겠습니까?')) { user.antiPhishingCode = ''; alert('삭제되었습니다.'); } } else if(type === 'all') { const check = prompt(`위험: 모든 보안 인증을 초기화합니다. ID '${user.id}' 입력`); if(check === user.id) { user.otp = false; user.mobileBinding = false; user.tradingPinSet = false; user.antiPhishingCode = ''; alert('해제되었습니다.'); } } render(); };
        window.saveUserGeneralInfo = function(id) { const user = db.users.find(u => u.id === id); if(user) { user.status = document.getElementById('ctrl-status').value; user.rank = document.getElementById('ctrl-rank').value; user.permissions.deposit = document.getElementById('indiv-dep').checked; user.permissions.withdraw = document.getElementById('indiv-with').checked; user.permissions.swap = document.getElementById('indiv-swap').checked; user.kyc = document.getElementById('ctrl-kyc').value; user.otp = document.getElementById('ctrl-otp').checked; user.mobileBinding = document.getElementById('ctrl-mobile').checked; } alert('저장 완료'); closeUserModal(); };
        window.executeAssetTx = function(id) { alert('트랜잭션 실행 완료'); render(); };
        
        window.saveAdmin = function() { 
            const id = document.getElementById('adm-id').value; const name = document.getElementById('adm-name').value; const email = document.getElementById('adm-email').value;
            if(!name || !email) return alert('입력 확인 요망');
            if(appState.editingAdminId === 'NEW') { db.admins.unshift({id, name, email, role: document.getElementById('adm-role').value, status: document.getElementById('adm-status').value, lastLoginIp:'New'}); }
            else { const a = db.admins.find(x=>x.id===appState.editingAdminId); a.name=name; a.email=email; a.role=document.getElementById('adm-role').value; a.status=document.getElementById('adm-status').value; }
            appState.editingAdminId = null; alert('저장 완료'); render(); 
        };
