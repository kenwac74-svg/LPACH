<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"><title>입출금 비주얼 가이드</title></head><body style="font-family:Arial,'Noto Sans KR',sans-serif;background:#050505;color:#e5e5e5;padding:48px"><main style="max-width:820px;margin:auto;background:#141414;border:1px solid #333;border-radius:16px;padding:36px"><h1>입출금 및 운영 통제 실무 액션 가이드</h1><p>개발팀, 운영/CS팀, 최고 재무 관리자(Admin)가 매일 수행해야 할 입출금 처리 및 시스템 통제 업무를 시각적으로 정리한 가이드입니다.</p><h2>핵심 흐름</h2><p>유저 출금 신청 → 운영팀 1차 심사 → 최고 관리자 승인 → 온체인 송금 → 완료/롤백 처리</p></main></body></html>
