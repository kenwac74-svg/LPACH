<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 검색 엔진 및 AI 봇 크롤링/인덱싱 원천 차단 메타 태그 -->

    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="slurp" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="duckduckbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="baiduspider" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="yandex" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="GPTBot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
    <meta name="ChatGPT-User" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
    <meta name="OAI-SearchBot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
    <meta name="ClaudeBot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
    <meta name="CCBot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
    <meta name="PerplexityBot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
    <meta http-equiv="X-Robots-Tag" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-500: #64748b;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
            --blue: #2563eb;
            --emerald: #059669;
            --amber: #d97706;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--slate-50);
            color: var(--slate-800);
            font-family: 'Noto Sans KR', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid var(--slate-200);
            backdrop-filter: blur(10px);
        }
        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
        }
        .topbar {
            min-height: 88px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }
        h1 {
            margin: 0;
            color: var(--slate-900);
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0;
        }
        .subtitle {
            margin-top: 5px;
            color: var(--slate-500);
            font-size: 12px;
            font-weight: 700;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(92px, 1fr));
            gap: 10px;
            min-width: 430px;
        }
        .summary-card {
            background: var(--slate-50);
            border: 1px solid var(--slate-200);
            border-radius: 8px;
            padding: 10px 12px;
            text-align: right;
        }
        .summary-card span {
            display: block;
            color: var(--slate-500);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .summary-card strong {
            display: block;
            margin-top: 3px;
            font-size: 22px;
            color: var(--slate-900);
            line-height: 1;
        }
        main { padding: 28px 0 56px; }
        .phase {
            margin-bottom: 22px;
            background: #fff;
            border: 1px solid var(--slate-200);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.04);
        }
        .phase-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 15px 18px;
            background: var(--slate-900);
            color: #fff;
        }
        .phase-title {
            font-size: 15px;
            font-weight: 900;
        }
        .phase-progress {
            min-width: 120px;
            text-align: right;
            font-size: 12px;
            font-weight: 900;
            color: #bfdbfe;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        th {
            background: var(--slate-100);
            color: var(--slate-500);
            border-bottom: 1px solid var(--slate-200);
            padding: 12px 14px;
            text-align: left;
            font-size: 11px;
            font-weight: 900;
        }
        td {
            padding: 14px;
            border-bottom: 1px solid var(--slate-100);
            font-size: 13px;
            vertical-align: middle;
        }
        tr:last-child td { border-bottom: 0; }
        tr.today { background: #ecfdf5; }
        tr.done { color: var(--slate-500); }
        .col-id { width: 70px; text-align: center; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-weight: 900; color: var(--slate-400); }
        .col-status { width: 86px; text-align: center; }
        .col-owner { width: 150px; font-weight: 800; }
        .col-task { width: 30%; font-weight: 900; color: var(--slate-900); }
        .col-note { color: var(--slate-600); }
        .col-progress { width: 150px; }
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 52px;
            height: 24px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 900;
        }
        .badge.done { background: #d1fae5; color: #047857; }
        .badge.ing { background: #dbeafe; color: #1d4ed8; }
        .badge.pending { background: var(--slate-100); color: var(--slate-600); }
        .badge.today { background: #059669; color: #fff; }
        .bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .track {
            flex: 1;
            height: 8px;
            background: var(--slate-100);
            border-radius: 999px;
            overflow: hidden;
        }
        .fill {
            height: 100%;
            border-radius: 999px;
            background: var(--blue);
        }
        .fill.done { background: var(--emerald); }
        .fill.pending { background: var(--slate-300); }
        .bar strong {
            width: 38px;
            text-align: right;
            font-size: 12px;
            color: var(--slate-900);
        }
        footer {
            max-width: 1180px;
            margin: 0 auto;
            padding: 20px 24px 42px;
            color: var(--slate-500);
            font-size: 12px;
            font-weight: 700;
            text-align: right;
        }
        @media (max-width: 860px) {
            .topbar { align-items: flex-start; flex-direction: column; padding: 18px 0; }
            .summary { width: 100%; min-width: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); }
            table, thead, tbody, tr, th, td { display: block; width: 100%; }
            thead { display: none; }
            tr { padding: 14px; border-bottom: 1px solid var(--slate-100); }
            td { border: 0; padding: 4px 0; }
            .col-id, .col-status, .col-owner, .col-task, .col-note, .col-progress { width: 100%; text-align: left; }
            .col-id { color: var(--slate-500); }
            .bar { margin-top: 8px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap topbar">
            <div>
                <h1>LONGRISE 업무 진척 타임라인</h1>
                <div class="subtitle">Grand Open Master Schedule · 2026.04.18 기준</div>
            </div>
            <section class="summary" aria-label="진척 요약">
                <div class="summary-card"><span>전체 진척</span><strong id="total-percent">0%</strong></div>
                <div class="summary-card"><span>완료</span><strong id="done-count">0</strong></div>
                <div class="summary-card"><span>진행</span><strong id="ing-count">0</strong></div>
                <div class="summary-card"><span>금일</span><strong id="today-count">0</strong></div>
            </section>
        </div>
    </header>

    <main class="wrap" id="timeline"></main>
    <footer>최종 업데이트: 2026년 4월 18일</footer>

    <script>
        const roadmapData = [
            { id: 1, phase: "1단계: 인프라 구축", title: "마스터플랜 및 보상 시나리오 확정", progress: 100, status: "DONE", note: "수익 캡(1000억) 도달 시뮬레이션 완료", owner: "정웅모, 여건", isToday: false },
            { id: 2, phase: "1단계: 인프라 구축", title: "초기 예산 배정 및 자금 분리(80/20)", progress: 100, status: "DONE", note: "리저브 및 마케팅 기금 물리적 분리 조치", owner: "정웅모, 여건", isToday: false },
            { id: 3, phase: "1단계: 인프라 구축", title: "공식 백서 확정 및 VVIP 피치덱 완성", progress: 95, status: "ING", note: "CNYT 백서 및 시나리오 진행 포함", owner: "정웅모", isToday: true },
            { id: 4, phase: "1단계: 인프라 구축", title: "영업 로직 설계 및 시뮬레이션 검증", progress: 100, status: "DONE", note: "단계별 영업자 낙수 매칭 설계 완료", owner: "정웅모, 여건", isToday: false },
            { id: 5, phase: "1단계: 인프라 구축", title: "오프쇼어 인프라 및 보안 예산 확정", progress: 100, status: "DONE", note: "코어 인프라 및 보안 설계 CAPEX 확정", owner: "정웅모", isToday: false },
            { id: 21, phase: "1단계: 인프라 구축", title: "해외 현지 인프라 구축", progress: 20, status: "ING", note: "TG 계정 2/10 및 클라우드 서버 확보 진행 중", owner: "김이석", isToday: true },

            { id: 24, phase: "1단계: 인프라 구축", title: "TOKEN 지갑 개발", progress: 70, status: "ING", note: "플랫폼 전용 토큰 지갑 연동 로직 개발", owner: "안동현", isToday: false },
            { id: 6, phase: "2단계: 시스템 검증", title: "홈페이지 베타버전(영문) 오픈", progress: 100, status: "DONE", note: "글로벌 공개용 웹사이트 배포 대기", owner: "정웅모", isToday: false },
            { id: 22, phase: "2단계: 시스템 검증", title: "글로벌 정식 홈페이지 오픈", progress: 90, status: "ING", note: "UI/UX 컨셉 설계 및 이미지 고도화", owner: "여건", isToday: true },
            { id: 7, phase: "2단계: 시스템 검증", title: "백오피스 연동 및 CBT 가동", progress: 0, status: "PENDING", note: "전산 실거래 테스트 및 정산 자동화 점검", owner: "안동현", isToday: false },
            { id: 8, phase: "2단계: 시스템 검증", title: "사전 마케팅 및 앰버서더 영업", progress: 30, status: "ING", note: "글로벌 리더 리스트업 및 개별 미팅 진행", owner: "김세호, 임철재", isToday: true },
            { id: 9, phase: "2단계: 시스템 검증", title: "투자금 수령 및 부서 예산 배분", progress: 100, status: "DONE", note: "운용 예산 부서별 배분 및 관리 시스템 가동", owner: "김세호", isToday: false },
            { id: 10, phase: "2단계: 시스템 검증", title: "자금 익명화 준비 및 컨트랙트 오딧", progress: 10, status: "ING", note: "보안 오딧 스케줄링 및 믹싱 시나리오 수립", owner: "정웅모, 신재일", isToday: false },
            { id: 25, phase: "2단계: 시스템 검증", title: "TOKEN 지갑 연동 테스트", progress: 0, status: "PENDING", note: "플랫폼 내 토큰 지갑 입출금 시나리오 테스트", owner: "안동현", isToday: false },
            { id: 11, phase: "3단계: 프리 런칭", title: "글로벌 VVIP 킥오프 행사 기획", progress: 0, status: "PENDING", note: "해외 대관 장소 리스트 확보 및 일정 조율", owner: "정웅모, 김세호", isToday: false },
            { id: 12, phase: "3단계: 프리 런칭", title: "디도스 방어망 및 모의 해킹", progress: 0, status: "PENDING", note: "인프라 안정성 부하 테스트 예정", owner: "안동현", isToday: false },
            { id: 13, phase: "3단계: 프리 런칭", title: "킥오프 행사 및 프리세일 영업", progress: 0, status: "PENDING", note: "오프라인 영업 채널 연동 준비", owner: "임철재, 여건", isToday: false },
            { id: 14, phase: "3단계: 프리 런칭", title: "상장 유동성 및 마케팅 풀 조성", progress: 0, status: "PENDING", note: "상장 예비 자금 분리 관리 조치", owner: "정웅모", isToday: false },
            { id: 15, phase: "3단계: 프리 런칭", title: "거래소 상장 법무 및 시범 연동", progress: 0, status: "PENDING", note: "카지노 현장 POS 연동 시스템 기획", owner: "정웅모", isToday: false },
            { id: 16, phase: "4단계: 그랜드 오픈", title: "운영 총괄 및 비상 대응 시스템", progress: 0, status: "PENDING", note: "글로벌 CS 통합 매뉴얼 수립 예정", owner: "김세호, 정웅모", isToday: false },
            { id: 17, phase: "4단계: 그랜드 오픈", title: "HFT 엔진 정식 가동 & 자동 정산", progress: 0, status: "PENDING", note: "수익 지급 스마트 컨트랙트 최종 가동", owner: "안동현, 정웅모", isToday: false },
            { id: 18, phase: "4단계: 그랜드 오픈", title: "행사 개최 및 글로벌 미디어 PR", progress: 0, status: "PENDING", note: "글로벌 크립토 뉴스 미디어 송출", owner: "김이석", isToday: false },
            { id: 19, phase: "4단계: 그랜드 오픈", title: "배당금 지급 및 바이백 집행", progress: 0, status: "PENDING", note: "투자자 바이백", owner: "김세호", isToday: false },
            { id: 20, phase: "4단계: 그랜드 오픈", title: "상장 실행 및 소각 모니터링", progress: 0, status: "PENDING", note: "TGE 완료 및 토큰 이코노미 소각 모니터링", owner: "정웅모", isToday: false }
        ];

        const statusMeta = {
            DONE: { text: '완료', badge: 'done' },
            ING: { text: '진행', badge: 'ing' },
            PENDING: { text: '대기', badge: 'pending' }
        };

        function renderSummary() {
            const total = Math.round(roadmapData.reduce((sum, item) => sum + item.progress, 0) / roadmapData.length);
            document.getElementById('total-percent').textContent = `${total}%`;
            document.getElementById('done-count').textContent = roadmapData.filter(item => item.status === 'DONE').length;
            document.getElementById('ing-count').textContent = roadmapData.filter(item => item.status === 'ING').length;
            document.getElementById('today-count').textContent = roadmapData.filter(item => item.isToday).length;
        }

        function renderTimeline() {
            const timeline = document.getElementById('timeline');
            const phases = [...new Set(roadmapData.map(item => item.phase))];
            timeline.innerHTML = phases.map(phase => {
                const items = roadmapData.filter(item => item.phase === phase);
                const avg = Math.round(items.reduce((sum, item) => sum + item.progress, 0) / items.length);
                return `
                    <section class="phase">
                        <div class="phase-head">
                            <div class="phase-title">${phase}</div>
                            <div class="phase-progress">완료 ${avg}%</div>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th class="col-id">순번</th>
                                    <th class="col-status">상태</th>
                                    <th class="col-owner">담당자</th>
                                    <th class="col-task">과업명</th>
                                    <th class="col-note">세부 현황</th>
                                    <th class="col-progress">진척도</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${items.map(item => {
                                    const meta = item.isToday ? { text: '금일', badge: 'today' } : statusMeta[item.status];
                                    const rowClass = item.isToday ? 'today' : (item.status === 'DONE' ? 'done' : '');
                                    const fillClass = item.status === 'DONE' ? 'done' : (item.status === 'PENDING' ? 'pending' : '');
                                    return `
                                        <tr class="${rowClass}">
                                            <td class="col-id">#${item.id}</td>
                                            <td class="col-status"><span class="badge ${meta.badge}">${meta.text}</span></td>
                                            <td class="col-owner">${item.owner || '-'}</td>
                                            <td class="col-task">${item.title}</td>
                                            <td class="col-note">${item.note || '-'}</td>
                                            <td class="col-progress">
                                                <div class="bar">
                                                    <div class="track"><div class="fill ${fillClass}" style="width:${item.progress}%"></div></div>
                                                    <strong>${item.progress}%</strong>
                                                </div>
                                            </td>
                                        </tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </section>`;
            }).join('');
        }

        renderSummary();
        renderTimeline();
    </script>
</body>
</html>
